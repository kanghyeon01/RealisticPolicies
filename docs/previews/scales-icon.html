<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scales Icon Preview</title>
<style>
:root { --bg:#f4f5f7; --card:#fff; --text:#1d2330; --dim:#5d6675; --line:#dfe3ea; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14171d; --card:#1c2028; --text:#e8edf4; --dim:#9aa4b2; --line:#2c323d; } }
:root[data-theme="dark"] { --bg:#14171d; --card:#1c2028; --text:#e8edf4; --dim:#9aa4b2; --line:#2c323d; }
body { margin:0; background:var(--bg); color:var(--text); font-family:"Segoe UI","Malgun Gothic",sans-serif; }
main { max-width:900px; margin:0 auto; padding:20px 16px 48px; }
h1 { font-size:20px; margin:0 0 6px; } p { color:var(--dim); font-size:14px; line-height:1.6; margin:4px 0 14px; }
.row { display:flex; flex-wrap:wrap; gap:18px; align-items:flex-end; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:14px; }
.cell { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; color:var(--dim); }
.scene { position:relative; height:220px; border-radius:8px; overflow:hidden; background:linear-gradient(180deg,#8fb3cf 0%,#cfdde6 45%,#6f8a5a 46%,#4f6a3e 100%); border:1px solid var(--line); }
.bldg { position:absolute; bottom:40px; width:110px; height:90px; background:#cbc4b6; left:50%; transform:translateX(-50%); }
.bldg:before { content:""; position:absolute; top:-30px; left:-10px; border-left:65px solid transparent; border-right:65px solid transparent; border-bottom:30px solid #8d8579; }
.icon { position:absolute; left:50%; transform:translateX(-50%); bottom:150px; width:48px; animation:bob 1.6s ease-in-out infinite; filter:drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
@keyframes bob { 0%,100% { transform:translate(-50%,0) scale(1); } 50% { transform:translate(-50%,-2px) scale(1.06); } }
</style></head><body><main>
<h1>시청 위 소송 경고 아이콘 미리보기</h1>
<p>게임 알림 아이콘의 육각형 바탕(교통 체증 아이콘과 같은 경로, 경고 노랑)에 저울을 얹었습니다. 오른쪽 셋은 게임 파일의 실제 알림 아이콘입니다. 게임에서는 이 그림을 C#에서 같은 좌표로 그려 텍스처로 만듭니다.</p>
