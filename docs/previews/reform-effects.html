<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행정 개혁 보고 패널</title>
<style>
/* Same values as docs/previews/report-panel.html (taken from the game's index.css, default theme). */
:root {
  --panel: rgba(42,55,83,.92);
  --panelDark: rgba(24,33,51,.94);
  --section: rgba(38,49,71,.5);
  --divider: rgba(255,255,255,.1);
  --accent: #4bc3f1;
  --text: #f0fbff;
  --dim: rgba(240,251,255,.7);
  --dimmer: rgba(240,251,255,.5);
  --positive: #8bdb46;
  --warning: #ffa42d;
  --negative: #e95f4a;
  --radius: 4px;
}
* { box-sizing: border-box; }
body { margin: 0; background: #2f3a2c; color: var(--text);
  font-family: Overpass, "Noto Sans KR", "Noto Sans", "Malgun Gothic", sans-serif; font-size: 14px; }
.page { padding: 16px; max-width: 1100px; }
.intro { font-size: 13px; color: var(--dim); line-height: 1.6; margin: 0 0 14px; max-width: 820px; }
.intro b { color: var(--text); font-weight: 600; }
.pick { display: flex; gap: 8px; margin: 0 0 14px; flex-wrap: wrap; }
.pick button { font: inherit; font-size: 13px; color: var(--text); background: rgba(255,255,255,.08); border: 0; border-radius: 3px; padding: 7px 14px; cursor: pointer; }
.pick button.on { background: #1e83aa; }
.cols { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.col { flex: 1 1 330px; max-width: 360px; }
.cap { font-size: 12px; color: var(--dimmer); margin: 0 0 6px; }
.side { background: var(--panelDark); border-radius: var(--radius); }
.side-in { background: var(--section); }
.side-head { padding: 12px; border-bottom: 2px solid var(--divider); display: flex; align-items: center; gap: 12px; }
.side-head .ic { width: 48px; height: 48px; border-radius: 4px; background: #eef3f5; flex: none; }
.side-head h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--accent); }
.side-head .lv { font-size: 12px; color: var(--dimmer); margin-top: 3px; }
.isec { padding: 6px 0; }
.isec + .isec { border-top: 2px solid var(--divider); }
.irow { display: flex; align-items: center; gap: 10px; padding: 4px 12px; min-height: 28px; font-size: 13px; }
.irow .l { flex: 1; color: var(--dim); }
.irow .r { text-align: right; white-space: nowrap; }
.irow.head .l { color: var(--text); text-transform: uppercase; font-size: 12px; letter-spacing: .02em; }
.irow.sub .l { padding-left: 10px; }
.irow.new { box-shadow: inset 3px 0 0 var(--accent); }
.r.pos { color: var(--positive); }
.r.neg { color: var(--negative); }
.irow[title] { cursor: help; }
.note-row { padding: 4px 12px 8px; font-size: 13px; line-height: 1.45; color: var(--warning); }
.legend { font-size: 12px; color: var(--dimmer); margin-top: 14px; line-height: 1.6; }
.legend i { display: inline-block; width: 3px; height: 12px; background: var(--accent); vertical-align: -1px; margin-right: 6px; }
@media (max-width: 720px) { .col { max-width: none; } }
</style>
</head>
<body>
<div class="page">
  <p class="intro">
    4번 묶음(행정 개혁) 정책을 골랐을 때 오른쪽 보고 칸에 <b>"행정에 준 효과"</b>를 보여 주는 방법입니다.
    지금 보고 칸은 <b>투입 · 활동 · 산출 · 결과</b> 순서이고, 다른 정책은 결과에 바닐라 값 변화(예: 단순직 임금 +10%)를 보여 줍니다.
    아래 버튼으로 두 안을 바꿔 볼 수 있습니다. 줄에 마우스를 올리면 설명이 나옵니다. 왼쪽에 파란 줄이 있는 행이 새로 생기는 행입니다.
  </p>
  <div class="pick">
    <button id="bA" class="on" onclick="show('A')">안 A: 결과 안에 넣기</button>
    <button id="bB" onclick="show('B')">안 B: "행정에 준 효과" 칸을 따로</button>
  </div>
  <div class="cols" id="cols"></div>
  <p class="legend"><i></i>새로 생기는 행. 예시 값은 전자정부 50%, 우정·통신 역량 80%, 공무원 보수 인상 10%, 공청회 의무화 켬 기준입니다.</p>
</div>
<script>
const POLICIES = [
  {
    name: "전자정부", level: "50%",
    input: [["일반행정직", "1명 (전체 1576명)"], ["우정·통신직", "2명 (전체 140명)"], ["전자정부 시스템 운영비", "¢9,500/월"]],
    activity: [["집행 역량", "92%"], ["업무 부담 (우정·통신직)", "18%"], ["효과가 나타나기까지", "약 0.6일"]],
    output: [["전달 정도", "46%"]],
    effects: [
      ["모든 정책 필요 인원", "-6%", "pos", "서류와 결재를 온라인으로 옮겨 정책마다 필요한 공무원이 줄었습니다. 우정·통신 역량에 비례합니다."],
      ["규제 포획 상한", "-7%", "pos", "행정이 투명해져 규제 대상과 유착할 여지가 줄었습니다."],
    ],
    note: null,
  },
  {
    name: "공무원 보수 인상", level: "10%",
    input: [["일반행정직", "1명 (전체 1576명)"], ["늘어난 시설 유지비", "¢41,200/월"]],
    activity: [["집행 역량", "100%"], ["업무 부담 (일반행정직)", "4%"], ["효과가 나타나기까지", "약 0.2일"]],
    output: [["전달 정도", "33%"]],
    lever: ["공무원 보수", "+10%", "neg"],
    effects: [
      ["정책에 쓸 수 있는 인원", "+3%", "pos", "그만두는 공무원이 줄어 실제로 일할 수 있는 인원이 늘었습니다."],
      ["규제 포획 상한", "-3%", "pos", "보수가 오르면 부패가 조금 줄어듭니다."],
    ],
    note: null,
  },
  {
    name: "공청회 의무화", level: "켬",
    input: [["일반행정직", "2명 (전체 1576명)"], ["공청회 개최비", "¢300/월"]],
    activity: [["집행 역량", "98%"], ["업무 부담 (일반행정직)", "4%"], ["효과가 나타나기까지", "약 0.2일"]],
    output: [["전달 정도", "98%"]],
    effects: [
      ["부담을 올릴 때 생기는 불만", "-29%", "pos", "공청회를 거친 결정은 더 쉽게 받아들여집니다."],
      ["소송의 절차 하자", "-0.10", "pos", "법원이 보는 절차상 흠이 줄어 소송에서 덜 집니다."],
      ["부담 정책이 시행되기까지", "+4시간", "neg", "공청회를 여는 만큼 규제가 늦게 시행됩니다."],
    ],
    note: null,
  },
];

function row(l, r, tone, tip, cls) {
  return `<div class="irow ${cls || ""}"${tip ? ` title="${tip}"` : ""}><span class="l">${l}</span><span class="r ${tone || ""}">${r}</span></div>`;
}
function section(title, rows) {
  return `<div class="isec">${row(title, "", "", "", "head")}${rows.join("")}</div>`;
}
function column(p, variant) {
  const input = p.input.map(([l, r]) => row(l, r, "", "", "sub"));
  const activity = p.activity.map(([l, r]) => row(l, r, "", "", "sub"));
  const output = p.output.map(([l, r]) => row(l, r, "", "", "sub"));
  const effects = p.effects.map(([l, r, t, tip]) => row(l, r, t, tip, "sub new"));
  const lever = p.lever ? [row(p.lever[0], p.lever[1], p.lever[2], "", "sub")] : [];
  let body = section("투입", input) + section("활동", activity) + section("산출", output);
  if (variant === "A") {
    body += section("결과", lever.concat(effects));
  } else {
    body += `<div class="isec">${row("행정에 준 효과", "", "", "", "head new")}${effects.join("")}</div>`;
    if (lever.length) body += section("결과", lever);
  }
  return `<div class="col"><p class="cap">${p.name}</p><div class="side"><div class="side-in">
    <div class="side-head"><div class="ic"></div><div><h3>${p.name}</h3><div class="lv">${p.level}</div></div></div>
    ${body}</div></div></div>`;
}
function show(v) {
  document.getElementById("cols").innerHTML = POLICIES.map((p) => column(p, v)).join("");
  document.getElementById("bA").classList.toggle("on", v === "A");
  document.getElementById("bB").classList.toggle("on", v === "B");
}
show("A");
</script>
</body>
</html>
